name: 'Run manually'

on:
  workflow_dispatch:
    inputs:
      exportPlatform:
        description: 'Activities exported from:'
        required: true
        default: 'igpsport'
        type: choice
        options:
          - igpsport
      importPlatform:
        description: 'Activities to be imported into:'
        required: true
        default: 'imxingzhe'
        type: choice
        options:
          - imxingzhe
  # 默认关闭定时运行；取消下面 schedule 块的注释即可每天自动运行。
  # schedule:
  #   # 01:15 Asia/Hong_Kong / Asia/Shanghai, GitHub cron uses UTC.
  #   - cron: '15 17 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      run: python -m unittest test_sync.py
    - name: Run sync
      env:
        EXPORT_PLATFORM: ${{ github.event.inputs.exportPlatform || 'igpsport' }}
        IMPORT_PLATFORM: ${{ github.event.inputs.importPlatform || 'imxingzhe' }}
        IGPSPORT_USERNAME: ${{ secrets.IGPSPORT_USERNAME }}
        IGPSPORT_PASSWORD: ${{ secrets.IGPSPORT_PASSWORD }}
        IMXINGZHE_USERNAME: ${{ secrets.IMXINGZHE_USERNAME }}
        IMXINGZHE_PASSWORD: ${{ secrets.IMXINGZHE_PASSWORD }}
        RUN_FOREVER: 'False'
      run: python3 main.py
